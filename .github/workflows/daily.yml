name: AI HOT 日报推送

on:
  schedule:
    - cron: "6 2 * * *"  # UTC 02:06 = 北京时间 10:06，与原本地 crontab 时间一致（GitHub 定时可能延迟 10-40 分钟）
  workflow_dispatch:  # 保留手动/本地触发

jobs:
  send-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send daily report
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python send_daily.py
