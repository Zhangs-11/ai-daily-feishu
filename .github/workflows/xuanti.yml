name: 选题池日报推送

on:
  schedule:
    - cron: "47 0 * * *"  # UTC 00:47 = 北京时间 08:47。避开整点：GitHub 高负载时整点 schedule 会被延迟甚至丢弃
  workflow_dispatch:  # 也支持本地 crontab / 手动触发

permissions:
  contents: write  # 推送记录 pushed_history.json 需要提交回仓库

jobs:
  send-xuanti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send xuanti report
        env:
          XUANTI_FEISHU_WEBHOOK_URL: ${{ secrets.XUANTI_FEISHU_WEBHOOK_URL }}
        run: python send_xuanti.py

      - name: Commit pushed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pushed_history.json
          if git diff --cached --quiet; then
            echo "推送记录无变化，跳过提交"
          else
            git commit -m "chore: 更新选题池推送记录"
            git pull --rebase origin main
            git push origin main
          fi
