name: 选题池日报推送

on:
  schedule:
    - cron: "47 0 * * *"  # UTC 00:47 = 北京时间 08:47。避开整点：GitHub 高负载时整点 schedule 会被延迟甚至丢弃
  workflow_dispatch:  # 也支持本地 crontab / 手动触发

jobs:
  send-xuanti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send xuanti report
        env:
          XUANTI_FEISHU_WEBHOOK_URL: ${{ secrets.XUANTI_FEISHU_WEBHOOK_URL }}
        run: python send_xuanti.py
