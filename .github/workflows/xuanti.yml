name: 选题池日报推送

on:
  schedule:
    - cron: "0 1 * * *"  # UTC 01:00 = 北京时间 09:00（GitHub 定时可能延迟 10-40 分钟）
  workflow_dispatch:  # 也支持本地 crontab / 手动触发

jobs:
  send-xuanti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send xuanti report
        env:
          XUANTI_FEISHU_WEBHOOK_URL: ${{ secrets.XUANTI_FEISHU_WEBHOOK_URL }}
        run: python send_xuanti.py
